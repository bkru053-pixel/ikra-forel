
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Премиальная Икра Форели с доставкой по Казахстану</title>
    <meta name="google-site-verification" content="GaD3AmbNsfgmC4zYh9QFxUfhOm6CKOWY3kVPri4uvQ4" />
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --bg-dark: #0f1115; --card-bg: #161920; --gold: #dfb76c; --text-light: #f5f6f8; --text-muted: #9aa0a6; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Montserrat', sans-serif; line-height: 1.6; }
        .hero { background: linear-gradient(rgba(15, 17, 21, 0.75), rgba(15, 17, 21, 0.95)), url('https://unsplash.com') no-repeat center center/cover; padding: 120px 20px; text-align: center; }
        .hero h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; color: var(--gold); margin-bottom: 15px; }
        .container { max-width: 1100px; margin: 0 auto; padding: 60px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-bottom: 60px; }
        .card { background: var(--card-bg); border: 1px solid rgba(223, 183, 108, 0.1); border-radius: 12px; overflow: hidden; text-align: center; padding-bottom: 30px; }
        .price { font-size: 2rem; font-weight: 700; color: var(--gold); margin-bottom: 20px; }
        .btn { display: inline-block; background: linear-gradient(135deg, #cfa353, #dfb76c); color: #0f1115; text-decoration: none; padding: 14px 35px; border-radius: 25px; font-weight: 700; text-transform: uppercase; }
        .footer { text-align: center; padding: 40px 20px; color: var(--text-muted); border-top: 1px solid rgba(223, 183, 108, 0.1); }
    </style>
</head>
<body>
    <header class="hero">
        <h1>Свежая Икра Форели</h1>
        <p>Премиальное качество деликатесов с экспресс-доставкой по Казахстану</p>
    </header>
    <main class="container">
        <div class="grid">
            <div class="card">
                <h3>Икра Форели 250 г</h3>
                <div class="price">8 250 ₸</div>
                <a href="https://wa.me" target="_blank" class="btn">Заказать в WhatsApp</a>
            </div>
            <!-- Полный код страницы содержит карточки на 500г и 1кг, а также блок с условиями доставки -->
        </div>
    </main>
    <footer class="footer">
        <p>Телефон: +7 (777) 686-72-87</p>
    </footer>
</body>
</html>
